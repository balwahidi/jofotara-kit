name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Every template validates
        shell: bash
        run: |
          for name in invoice credit-note income-invoice income-credit-note \
                      receivable-invoice receivable-credit-note income-receivable-invoice income-receivable-credit-note; do
            node dist/cli.js template "$name" | node dist/cli.js validate
          done
